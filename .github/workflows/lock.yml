name: Lock closed conversations

on:
  schedule:
    - cron: '0 1 * * *'
  workflow_dispatch:

permissions:
  issues: write
  pull-requests: write
  discussions: write

jobs:
  lock:
    runs-on: ubuntu-latest

    steps:
      - uses: dessant/lock-threads@v6
        with:
          issue-inactive-days: '60'
          pr-inactive-days: '60'
          discussion-inactive-days: '60'
          issue-lock-reason: resolved
          pr-lock-reason: resolved
