{% if config.devices %}
  <table class="table table-hover mb-0">
    <thead>
      <tr>
        <th>Name</th>
        <th>IP Address</th>
        <th>MAC Address</th>
        <th></th>
      </tr>
    </thead>
    <tbody>
      {% for device in config.devices %}
        <tr class="align-middle">
          <td class="text-dark fw-semibold">{{ device.name }}</td>
          <td class="text-muted">{{ device.ip }}</td>
          <td class="text-muted">{{ device.mac }}</td>
          <td class="text-end">
            <button type="button" class="btn btn-primary" data-page="devices" data-device-index="{{ loop.index0 }}">Edit</button>
          </td>
        </tr>
      {% endfor %}
    </tbody>
  </table>
{% else %}
  <div class="card text-center mb-4 border-dashed">
    <div class="card-body">
      <h6 class="fw-semibold">No devices configured</h6>
      <p class="small">Add your first Samsung TV to get started with Homebridge control</p>

      <button type="button" class="btn btn-primary" data-page="devices"><i class="fas fa-plus"></i> Add your first device</button>
    </div>
  </div>
{% endif %}
